name: Build v3.8.50 for darwin-arm64
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      max-parallel: 1
    steps:
      - name: Checkout v3.8.50
        uses: actions/checkout@v4
        with:
          ref: v3.8.50
          submodules: recursive

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps + Build + Package (single step, retried)
        continue-on-error: false
        run: |
          set -euxo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          # Limit page-data workers to 1 to stay well under the runner's 16GB cap
          NODE_OPTIONS="--max-old-space-size=6144" \
          NEXT_EXTRA_RUNTIME_WORKER_THREADS=0 \
          NEXT_TELEMETRY_DISABLED=1 \
            npm run build
          node scripts/build/postinstall.mjs || true
          mkdir -p artifact
          # Copy the produced standalone + source tree (exclude heavy dev artifacts)
          cp -r .next/standalone artifact/  2>/dev/null || true
          cp -r .next/static artifact/.next/static 2>/dev/null || true
          cp -r bin scripts src app public package.json package-lock.json artifact/ 2>/dev/null || true
          tar czf omniroute-3.8.50-built.tar.gz -C artifact .
          echo "Artifact size:"
          ls -lh omniroute-3.8.50-built.tar.gz
          echo "Standalone server present?"
          ls -la artifact/.next/standalone/server.js 2>&1 || echo "WARN: standalone/server.js missing"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-3.8.50-built
          path: omniroute-3.8.50-built.tar.gz
          retention-days: 7
          if-no-files-found: error